spring:
  application:
    name: demo

  datasource:
    url: jdbc:mysql://localhost:3306/fdmodule
    username: root
    password: rish
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: fd-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.BankingTech.demo"
logging:
  level:
    org.springframework.kafka: INFO
    org.apache.kafka.clients.consumer: WARN

server:
  port: 8081

  